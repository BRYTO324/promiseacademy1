<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parent Portal — Promise Academy</title>
  <link rel="icon" type="image/jpeg" href="../assets/logo/logo1.jpg"/>
  <link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/dashboard.css"/><link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body>
<div class="app-shell">

  <!-- PARENT SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <a href="#" class="sidebar-brand">
      <img src="../assets/logo/logo1.jpg" alt="Logo" class="sidebar-logo"/>
      <div class="sidebar-brand-text"><div class="sidebar-school-name">Promise Academy</div><div class="sidebar-tagline">Parent Portal</div></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Overview</div>
      <a href="#" class="nav-item active" onclick="showView('dashboard')"><span class="nav-icon">🏠</span><span class="nav-label">My Dashboard</span></a>
      <div class="sidebar-section-label">My Children</div>
      <a href="#" class="nav-item" onclick="showView('children')"><span class="nav-icon">👨‍👩‍👧</span><span class="nav-label">My Children</span></a>
      <a href="#" class="nav-item" onclick="showView('attendance')"><span class="nav-icon">📅</span><span class="nav-label">Attendance</span></a>
      <a href="#" class="nav-item" onclick="showView('results')"><span class="nav-icon">📊</span><span class="nav-label">Results</span></a>
      <a href="#" class="nav-item" onclick="showView('fees')"><span class="nav-icon">💰</span><span class="nav-label">Fees &amp; Payments</span></a>
      <a href="#" class="nav-item" onclick="showView('timetable')"><span class="nav-icon">🗓</span><span class="nav-label">Timetable</span></a>
      <div class="sidebar-section-label">Communication</div>
      <a href="#" class="nav-item" onclick="showView('announcements')"><span class="nav-icon">📢</span><span class="nav-label">Announcements</span><span class="nav-badge">2</span></a>
      <a href="#" class="nav-item" onclick="showView('notifications')"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span><span class="nav-badge">3</span></a>
    </nav>
    <div class="sidebar-footer"><a href="../index.html" class="nav-item" style="color:rgba(255,255,255,0.5)"><span class="nav-icon">🚪</span><span class="nav-label">Logout</span></a></div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar">
      <button class="topbar-toggle" id="sidebarToggle">☰</button>
      <div style="flex:1;display:flex;align-items:center;gap:var(--space-sm);">
        <span style="font-size:14px;font-weight:600;color:var(--text-secondary);">Welcome back,</span>
        <strong id="parentNameDisplay" style="color:var(--primary-color);">Mrs. Funke Adeyemi</strong>
      </div>
      <!-- Child Selector -->
      <div style="display:flex;align-items:center;gap:var(--space-sm);margin-right:var(--space-md);">
        <label style="font-size:12px;color:var(--text-muted);white-space:nowrap;">Viewing:</label>
        <select class="filter-select" id="childSelector" onchange="switchChild(this.value)" style="border-color:var(--primary-color);font-weight:600;">
        </select>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn" id="themeToggle">🌙</button>
        <div class="avatar-placeholder avatar-sm" style="background:var(--secondary-color);color:white;font-weight:700;">FA</div>
        <button class="topbar-toggle" id="mobileSidebarToggle" style="display:none;">☰</button>
      </div>
    </header>

    <div class="content-wrapper" id="portalContent">
      <!-- Content rendered by JS -->
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="../js/data.js"></script><script src="../js/app.js"></script>
<script>
  function checkMobile(){const mb=document.getElementById('mobileSidebarToggle');if(mb)mb.style.display=window.innerWidth<=1023?'flex':'none';}
  window.addEventListener('resize',checkMobile);checkMobile();

  // Demo: parent PAR005 has 2 children
  const PARENT = PA_DATA.parents.find(p=>p.id==='PAR005') || PA_DATA.parents[0];
  let currentChildId = PARENT.children[0];

  document.getElementById('parentNameDisplay').textContent = PARENT.name;

  // Populate child selector
  const sel = document.getElementById('childSelector');
  PARENT.children.forEach(cid=>{
    const s=getStudent(cid);
    if(!s) return;
    const o=document.createElement('option');
    o.value=cid;
    o.textContent=`${s.name.split(' ')[0]} — ${getClass(s.classId)?.name||s.classId}`;
    sel.appendChild(o);
  });

  window.switchChild = function(childId){ currentChildId=childId; renderCurrentView(); };

  let currentView='dashboard';

  function showView(view){
    currentView=view;
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    event.currentTarget.classList.add('active');
    renderCurrentView();
  }

  function renderCurrentView(){
    const s=getStudent(currentChildId);
    const cls=s?getClass(s.classId):null;
    const map={dashboard:renderParentDashboard,children:renderChildren,attendance:renderParentAttendance,results:renderParentResults,fees:renderParentFees,timetable:renderParentTimetable,announcements:renderAnnouncements,notifications:renderParentNotifications};
    if(map[currentView]) map[currentView](s,cls);
  }

  function renderParentDashboard(s, cls){
    const initials=s?s.name.split(' ').map(n=>n[0]).join('').slice(0,2):'??';
    document.getElementById('portalContent').innerHTML=`
      <div class="page-header">
        <div class="page-header-left"><h1 class="page-title">Parent Dashboard</h1><p class="page-subtitle">Monitoring ${s?s.name:'your child'}'s progress at Promise Academy</p></div>
      </div>

      <!-- Child Summary Banner -->
      <div class="dashboard-welcome" style="margin-bottom:var(--space-xl);">
        <div class="welcome-content">
          <div class="welcome-greeting">Currently Viewing</div>
          <h2 class="welcome-title">${s?s.name:'Unknown'}</h2>
          <p class="welcome-subtitle">${cls?cls.name:''} · ${s?getSectionName(s.section):''} · ${PA_DATA.school.session}</p>
          <div class="welcome-meta">
            <span class="welcome-meta-item">🪪 ${s?s.id:''}</span>
            <span class="welcome-meta-item">📋 Adm: ${s?s.admissionNo:''}</span>
            <span class="welcome-meta-item">📅 ${PA_DATA.school.term}</span>
          </div>
        </div>
        <div style="position:relative;z-index:1;">
          <div class="avatar-placeholder" style="width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.15);color:white;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,0.3);">${initials}</div>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:var(--space-xl);">
        <div class="stat-card green" style="padding:var(--space-lg);"><div class="stat-icon green" style="width:40px;height:40px;">📅</div><div class="stat-content"><div class="stat-value">94%</div><div class="stat-label">Attendance Rate</div></div></div>
        <div class="stat-card gold" style="padding:var(--space-lg);"><div class="stat-icon gold" style="width:40px;height:40px;">📊</div><div class="stat-content"><div class="stat-value">83.1%</div><div class="stat-label">Average Score</div></div></div>
        <div class="stat-card ${getPaidStatus(s?s.id:'')?'green':'red'}" style="padding:var(--space-lg);"><div class="stat-icon ${getPaidStatus(s?s.id:'')?'green':'red'}" style="width:40px;height:40px;">💰</div><div class="stat-content"><div class="stat-value">${getPaidStatus(s?s.id:'')?'Paid':'Pending'}</div><div class="stat-label">Fee Status</div></div></div>
        <div class="stat-card blue" style="padding:var(--space-lg);"><div class="stat-icon blue" style="width:40px;height:40px;">📝</div><div class="stat-content"><div class="stat-value">2nd</div><div class="stat-label">Position in Class</div></div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xl);">
        <!-- Quick Actions -->
        <div class="card">
          <div class="card-header"><span class="card-title">⚡ Quick Links</span></div>
          <div class="card-body" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm);">
            <button class="btn btn-outline" onclick="showView('results')" style="justify-content:flex-start;gap:8px;">📊 View Results</button>
            <button class="btn btn-outline" onclick="showView('fees')" style="justify-content:flex-start;gap:8px;">💰 Pay Fees</button>
            <button class="btn btn-outline" onclick="showView('attendance')" style="justify-content:flex-start;gap:8px;">📅 Attendance</button>
            <button class="btn btn-outline" onclick="showView('timetable')" style="justify-content:flex-start;gap:8px;">🗓 Timetable</button>
          </div>
        </div>
        <!-- Announcements -->
        <div class="card">
          <div class="card-header"><span class="card-title">📢 Recent Announcements</span></div>
          <div class="card-body" style="padding:var(--space-md);">
            ${[{title:'Second Term Examination Timetable Released',time:'2 days ago'},{title:'PTA Meeting — Saturday 15th March, 10am',time:'3 days ago'},{title:'Sports Day — Friday 28th March',time:'1 week ago'}].map(a=>`
              <div style="padding:var(--space-sm) 0;border-bottom:1px solid var(--border-light);">
                <div style="font-weight:600;font-size:13px;">${a.title}</div>
                <div style="font-size:11px;color:var(--text-muted);">${a.time}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function getPaidStatus(studentId){
    return PA_DATA.payments.some(p=>p.studentId===studentId&&p.status==='paid');
  }

  function renderChildren(s, cls){
    document.getElementById('portalContent').innerHTML=`
      <h1 class="page-title" style="margin-bottom:var(--space-xl);">My Children</h1>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-lg);">
        ${PARENT.children.map(cid=>{
          const child=getStudent(cid);
          const childCls=child?getClass(child.classId):null;
          if(!child) return '';
          const initials=child.name.split(' ').map(n=>n[0]).join('').slice(0,2);
          return `
          <div class="card" style="padding:var(--space-xl);">
            <div style="display:flex;align-items:center;gap:var(--space-lg);margin-bottom:var(--space-lg);">
              <div class="avatar-placeholder avatar-xl" style="background:var(--primary-ghost);color:var(--primary-color);font-size:22px;font-weight:700;">${initials}</div>
              <div>
                <div style="font-size:18px;font-weight:700;">${child.name}</div>
                <div style="font-size:13px;color:var(--text-muted);">${childCls?childCls.name:child.classId} · ${getSectionName(child.section)}</div>
                <span class="badge badge-success badge-dot" style="margin-top:4px;">${child.status==='active'?'Active':''}</span>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin-bottom:var(--space-lg);">
              <div><span style="color:var(--text-muted);">Student ID:</span> <strong>${child.id}</strong></div>
              <div><span style="color:var(--text-muted);">Adm No:</span> <strong>${child.admissionNo}</strong></div>
              <div><span style="color:var(--text-muted);">Gender:</span> <strong>${child.gender}</strong></div>
              <div><span style="color:var(--text-muted);">DOB:</span> <strong>${formatDate(child.dob)}</strong></div>
            </div>
            <button class="btn btn-primary w-full" onclick="document.getElementById('childSelector').value='${cid}';switchChild('${cid}');showView('dashboard')" style="justify-content:center;">View Dashboard</button>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  function renderParentAttendance(s){
    document.getElementById('portalContent').innerHTML=`
      <h1 class="page-title" style="margin-bottom:var(--space-xl);">Attendance — ${s?s.name:''}</h1>
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:var(--space-xl);">
        <div class="stat-card green" style="padding:var(--space-lg);"><div class="stat-icon green" style="width:40px;height:40px;">✅</div><div class="stat-content"><div class="stat-value">50</div><div class="stat-label">Days Present</div></div></div>
        <div class="stat-card red" style="padding:var(--space-lg);"><div class="stat-icon red" style="width:40px;height:40px;">❌</div><div class="stat-content"><div class="stat-value">3</div><div class="stat-label">Days Absent</div></div></div>
        <div class="stat-card orange" style="padding:var(--space-lg);"><div class="stat-icon orange" style="width:40px;height:40px;">⏰</div><div class="stat-content"><div class="stat-value">2</div><div class="stat-label">Late Arrivals</div></div></div>
        <div class="stat-card green" style="padding:var(--space-lg);"><div class="stat-icon green" style="width:40px;height:40px;">📊</div><div class="stat-content"><div class="stat-value">94.5%</div><div class="stat-label">Rate</div></div></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">📅 Attendance Record — This Term</span></div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;" id="calGrid"></div>
          <div style="display:flex;gap:var(--space-lg);margin-top:var(--space-lg);">
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;"><div style="width:14px;height:14px;background:var(--success-color);border-radius:3px;"></div>Present</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;"><div style="width:14px;height:14px;background:var(--danger-color);border-radius:3px;"></div>Absent</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;"><div style="width:14px;height:14px;background:var(--warning-color);border-radius:3px;"></div>Late</div>
          </div>
        </div>
      </div>
    `;
    // Render calendar dots
    const grid = document.getElementById('calGrid');
    for(let i=1;i<=55;i++){
      const r=Math.random();
      const color=r>0.06?'var(--success-color)':r>0.03?'var(--danger-color)':'var(--warning-color)';
      grid.innerHTML+=`<div style="width:100%;height:28px;background:${color};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:white;font-weight:700;">${i}</div>`;
    }
  }

  function renderParentResults(s, cls){
    const resultData = PA_DATA.results[s?s.id:''] || null;
    document.getElementById('portalContent').innerHTML=`
      <h1 class="page-title" style="margin-bottom:var(--space-xl);">Results — ${s?s.name:''}</h1>
      ${!resultData?`<div class="card"><div class="empty-state" style="padding:60px;"><div class="empty-state-icon">📊</div><div class="empty-state-title">No Results Available</div><div class="empty-state-desc">Results for the current term have not been published yet.</div></div></div>`:`
      <div class="card">
        <div class="card-header"><span class="card-title">📊 ${resultData.term} Results — ${resultData.session}</span><a href="../pages/report-card.html?student=${s.id}" class="btn btn-primary btn-sm">🖨 Print Report Card</a></div>
        <div class="table-wrapper">
          <table class="table">
            <thead><tr><th>Subject</th><th style="text-align:center;">CA (30)</th><th style="text-align:center;">Exam (70)</th><th style="text-align:center;">Total</th><th style="text-align:center;">Grade</th><th>Remark</th></tr></thead>
            <tbody>
              ${resultData.subjects.map(subj=>`
                <tr>
                  <td><strong>${subj.name}</strong></td>
                  <td style="text-align:center;">${subj.ca}</td>
                  <td style="text-align:center;">${subj.exam}</td>
                  <td style="text-align:center;font-weight:700;color:${subj.total>=75?'var(--success-color)':subj.total<45?'var(--danger-color)':'var(--warning-color)'};">${subj.total}</td>
                  <td style="text-align:center;font-weight:700;color:var(--primary-color);">${subj.grade}</td>
                  <td style="font-size:12px;">${subj.remark}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="card-footer" style="display:flex;gap:var(--space-xl);">
          <div><span style="font-size:12px;color:var(--text-muted);">Average: </span><strong style="color:var(--primary-color);">${resultData.average}%</strong></div>
          <div><span style="font-size:12px;color:var(--text-muted);">Position: </span><strong style="color:var(--secondary-color);">${resultData.position} of ${resultData.totalStudents}</strong></div>
        </div>
      </div>`}
    `;
  }

  function renderParentFees(s){
    const payment = PA_DATA.payments.find(p=>p.studentId===(s?s.id:''));
    const cls = s?getClass(s.classId):null;
    const feeData = s?PA_DATA.feeStructure[s.section]:null;
    document.getElementById('portalContent').innerHTML=`
      <h1 class="page-title" style="margin-bottom:var(--space-xl);">Fees &amp; Payments — ${s?s.name:''}</h1>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xl);">
        <div class="card">
          <div class="card-header"><span class="card-title">💰 Fee Structure — ${s?getSectionName(s.section):''}</span></div>
          <div class="card-body">
            ${feeData?`<table style="width:100%;font-size:13px;"><tbody>
              <tr><td style="padding:8px 0;color:var(--text-muted);">Tuition</td><td style="text-align:right;font-weight:600;">₦${feeData.tuition.toLocaleString()}</td></tr>
              <tr><td style="padding:8px 0;color:var(--text-muted);">Registration</td><td style="text-align:right;font-weight:600;">₦${feeData.registration.toLocaleString()}</td></tr>
              <tr><td style="padding:8px 0;color:var(--text-muted);">Examination</td><td style="text-align:right;font-weight:600;">₦${feeData.examination.toLocaleString()}</td></tr>
              <tr><td style="padding:8px 0;color:var(--text-muted);">Books</td><td style="text-align:right;font-weight:600;">₦${feeData.books.toLocaleString()}</td></tr>
              <tr><td style="padding:8px 0;color:var(--text-muted);">Uniform</td><td style="text-align:right;font-weight:600;">₦${feeData.uniform.toLocaleString()}</td></tr>
              <tr style="border-top:2px solid var(--border-color);"><td style="padding:10px 0;font-weight:700;color:var(--primary-color);">Total</td><td style="text-align:right;font-weight:700;font-size:16px;color:var(--primary-color);">₦${feeData.total.toLocaleString()}</td></tr>
            </tbody></table>`:'N/A'}
          </div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">📋 Payment Status</span></div>
          <div class="card-body">
            ${payment?`
              <div style="text-align:center;padding:var(--space-xl);">
                <div style="font-size:48px;margin-bottom:var(--space-md);">${payment.status==='paid'?'✅':'⏳'}</div>
                <span class="badge badge-dot ${payment.status==='paid'?'badge-success':'badge-warning'}" style="font-size:14px;padding:8px 16px;">${payment.status==='paid'?'Fees Paid':'Payment Pending'}</span>
                ${payment.status==='paid'?`<div style="margin-top:var(--space-md);font-size:13px;color:var(--text-muted);">Paid on ${formatDate(payment.date)} via ${payment.method}</div><div style="font-size:13px;color:var(--text-muted);">Receipt: ${payment.receiptNo}</div>`:'<div style="margin-top:var(--space-md);font-size:13px;color:var(--text-muted);">Please make payment to avoid any disruption.</div>'}
              </div>`:'<div class="empty-state" style="padding:40px;"><div class="empty-state-icon">💰</div><div class="empty-state-title">No payment record</div></div>'}
          </div>
        </div>
      </div>
    `;
  }

  function renderParentTimetable(s, cls){
    document.getElementById('portalContent').innerHTML=`
      <h1 class="page-title" style="margin-bottom:var(--space-xl);">Timetable — ${s?s.name:''}</h1>
      <div class="card">
        <div class="card-header"><span class="card-title">🗓 Class Timetable — ${cls?cls.name:''}</span></div>
        <div class="card-body"><p style="color:var(--text-muted);">Full timetable visible below. Contact the class teacher for changes.</p></div>
        <div style="overflow-x:auto;"><table class="table" style="min-width:600px;font-size:13px;" id="parentTT"></table></div>
      </div>
    `;
    const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];
    const subjects=cls?cls.section==='nursery'?PA_DATA.subjects.nursery:cls.section==='primary'?PA_DATA.subjects.primary:PA_DATA.subjects.secondary_jss:PA_DATA.subjects.primary;
    const periods=['7:30–8:15','8:15–9:00','9:00–9:45','9:45–10:30','BREAK','11:00–11:45','11:45–12:30','12:30–1:15'];
    const colors=['#e8f5e8','#e3f2fd','#fff8e1','#fce4ec','#f3e5f5','#e0f2f1','#fff3e0','#e8eaf6'];
    const tt=document.getElementById('parentTT');
    tt.innerHTML=`<thead><tr><th>Period</th>${days.map(d=>`<th style="text-align:center;">${d}</th>`).join('')}</tr></thead>`;
    const tbody=document.createElement('tbody');
    periods.forEach((p,pi)=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td style="font-size:11px;font-weight:700;color:var(--text-muted);white-space:nowrap;">${p}</td>`;
      if(p==='BREAK'){tr.innerHTML+=`<td colspan="5" style="text-align:center;font-weight:700;color:var(--warning-color);">☕ BREAK TIME</td>`;tbody.appendChild(tr);return;}
      days.forEach((_,di)=>{
        const seed=cls?(cls.id.charCodeAt(0)+di*3+pi*2)%subjects.length:0;
        const subj=subjects[seed];
        const ci=subjects.indexOf(subj)%colors.length;
        tr.innerHTML+=`<td><div style="background:${colors[ci]};padding:5px 6px;border-radius:4px;text-align:center;font-size:12px;">${subj}</div></td>`;
      });
      tbody.appendChild(tr);
    });
    tt.appendChild(tbody);
  }

  function renderAnnouncements(){
    document.getElementById('portalContent').innerHTML=`
      <h1 class="page-title" style="margin-bottom:var(--space-xl);">Announcements</h1>
      <div style="display:flex;flex-direction:column;gap:var(--space-md);">
        ${[
          {title:'Second Term Examination Timetable Released',body:'The examination timetable for the second term has been released. Please check with your ward\'s class teacher for the detailed schedule.',date:'March 5, 2025',icon:'📋',badge:'Examinations'},
          {title:'PTA Meeting — Saturday 15th March 2025',body:'All parents are cordially invited to the PTA meeting scheduled for Saturday 15th March 2025 at 10:00 AM in the school hall. Refreshments will be provided.',date:'March 3, 2025',icon:'📢',badge:'General'},
          {title:'Annual Sports Day — Friday 28th March 2025',body:'Promise Academy Annual Sports Day will hold on Friday 28th March 2025. Students are encouraged to wear their house colours. Parents are invited to attend.',date:'February 28, 2025',icon:'🏃','badge':'Event'},
          {title:'Second Term Fee Payment Reminder',body:'We remind all parents that second term fees are due. Please ensure payment is made before March 20th to avoid any disruption to your ward\'s academic activities.',date:'February 20, 2025',icon:'💰',badge:'Finance'},
        ].map(a=>`
          <div class="card" style="padding:0;">
            <div class="card-body" style="padding:var(--space-xl);">
              <div style="display:flex;align-items:flex-start;gap:var(--space-lg);">
                <div style="font-size:28px;flex-shrink:0;">${a.icon}</div>
                <div style="flex:1;">
                  <div style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-sm);">
                    <strong style="font-size:15px;">${a.title}</strong>
                    <span class="badge badge-primary" style="font-size:10px;">${a.badge}</span>
                  </div>
                  <p style="color:var(--text-secondary);font-size:13px;line-height:1.7;margin-bottom:var(--space-sm);">${a.body}</p>
                  <span style="font-size:11px;color:var(--text-muted);">📅 ${a.date}</span>
                </div>
              </div>
            </div>
          </div>`).join('')}
      </div>
    `;
  }

  function renderParentNotifications(){
    document.getElementById('portalContent').innerHTML=`
      <h1 class="page-title" style="margin-bottom:var(--space-xl);">Notifications</h1>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm);">
        ${PA_DATA.notifications.map(n=>`
          <div class="card" style="border-left:4px solid var(--primary-color);padding:0;${n.read?'opacity:0.7':''}">
            <div style="padding:var(--space-md) var(--space-lg);display:flex;gap:var(--space-md);align-items:center;">
              <span style="font-size:20px;">${n.icon}</span>
              <div style="flex:1;">
                <div style="font-weight:${n.read?'500':'700'};font-size:13px;">${n.title}</div>
                <div style="font-size:12px;color:var(--text-muted);">${n.message}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                <span style="font-size:11px;color:var(--text-muted);">${n.time}</span>
                ${!n.read?'<span class="badge badge-primary" style="font-size:9px;">NEW</span>':''}
              </div>
            </div>
          </div>`).join('')}
      </div>
    `;
  }

  // Init
  renderCurrentView();
</script>
</body>
</html>
