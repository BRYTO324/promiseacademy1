<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Profile — Promise Academy</title>
  <link rel="icon" type="image/jpeg" href="../assets/logo/logo1.jpg"/>
  <link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/dashboard.css"/><link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/print.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a href="../dashboard.html" class="sidebar-brand"><img src="../assets/logo/logo1.jpg" alt="Logo" class="sidebar-logo"/><div class="sidebar-brand-text"><div class="sidebar-school-name">Promise Academy</div><div class="sidebar-tagline">School Management</div></div></a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div><a href="../dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <div class="sidebar-section-label">Academic</div><a href="students.html" class="nav-item active"><span class="nav-icon">🎓</span><span class="nav-label">Students</span></a><a href="admissions.html" class="nav-item"><span class="nav-icon">📋</span><span class="nav-label">Admissions</span></a><a href="classes.html" class="nav-item"><span class="nav-icon">🏫</span><span class="nav-label">Classes</span></a>
      <div class="sidebar-section-label">Operations</div><a href="attendance.html" class="nav-item"><span class="nav-icon">📅</span><span class="nav-label">Attendance</span></a><a href="finance.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Finance</span></a>
      <div class="sidebar-section-label">Results</div><a href="results.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Results</span></a><a href="report-card.html" class="nav-item"><span class="nav-icon">📄</span><span class="nav-label">Report Cards</span></a>
      <div class="sidebar-section-label">System</div><a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a>
    </nav>
    <div class="sidebar-footer"><a href="../index.html" class="nav-item" style="color:rgba(255,255,255,0.5)"><span class="nav-icon">🚪</span><span class="nav-label">Logout</span></a></div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar">
      <button class="topbar-toggle" id="sidebarToggle">☰</button>
      <div class="topbar-search"><div class="search-bar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" placeholder="Search…"/></div></div>
      <div class="topbar-actions"><button class="topbar-btn" id="themeToggle">🌙</button><div class="avatar-placeholder avatar-sm" style="background:var(--primary-color);color:white;font-weight:700;">OA</div><button class="topbar-toggle" id="mobileSidebarToggle" style="display:none;">☰</button></div>
    </header>

    <div class="content-wrapper" id="profileWrapper">
      <div style="text-align:center;padding:60px;color:var(--text-muted);">Loading student profile…</div>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="../js/data.js"></script><script src="../js/app.js"></script>
<script>
  function checkMobile(){const mb=document.getElementById('mobileSidebarToggle');if(mb)mb.style.display=window.innerWidth<=1023?'flex':'none';}
  window.addEventListener('resize',checkMobile);checkMobile();

  function loadProfile(){
    const params=new URLSearchParams(window.location.search);
    const id=params.get('id')||'STU001';
    const student=getStudent(id)||PA_DATA.students[0];
    const cls=getClass(student.classId);
    const parent=getParent(student.parentId);
    const resultData=PA_DATA.results[student.id];
    const initials=student.name.split(' ').map(n=>n[0]).join('').slice(0,2);
    const sectionColors={nursery:'#00897b',primary:'var(--primary-color)',secondary:'var(--secondary-color)'};
    const color=sectionColors[student.section]||'var(--primary-color)';

    document.getElementById('profileWrapper').innerHTML=`
      <div class="page-header no-print">
        <div class="page-header-left">
          <div class="breadcrumb"><a href="../dashboard.html">🏠 Dashboard</a><span class="sep">›</span><a href="students.html">Students</a><span class="sep">›</span><span class="current">${student.name}</span></div>
          <h1 class="page-title">Student Profile</h1>
        </div>
        <div class="page-header-right">
          <a href="students.html" class="btn btn-ghost">← Back</a>
          <a href="report-card.html?student=${student.id}" class="btn btn-outline">📄 Report Card</a>
          <button class="btn btn-primary" onclick="window.print()">🖨 Print Profile</button>
        </div>
      </div>

      <!-- Banner -->
      <div class="profile-banner" style="margin-bottom:var(--space-xl);">
        <div class="avatar-placeholder" style="width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.15);color:white;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;border:4px solid rgba(255,255,255,0.3);flex-shrink:0;">${initials}</div>
        <div class="profile-info">
          <div class="profile-name">${student.name}</div>
          <div class="profile-meta">
            <span class="profile-meta-item">🪪 ${student.id}</span>
            <span class="profile-meta-item">📋 ${student.admissionNo}</span>
            <span class="profile-meta-item">🏫 ${cls?cls.name:student.classId}</span>
            <span class="profile-meta-item">📚 ${getSectionName(student.section)} Section</span>
          </div>
          <span class="badge badge-dot ${student.status==='active'?'badge-success':'badge-danger'}">${student.status==='active'?'Active Student':'Inactive'}</span>
        </div>
      </div>

      <!-- Tabs -->
      <div style="display:flex;gap:2px;border-bottom:2px solid var(--border-light);margin-bottom:var(--space-xl);" class="no-print">
        ${['Overview','Academic','Attendance','Fees','Results'].map((t,i)=>`
          <button onclick="switchTab(this,'tab${i}')" class="tab-trigger" style="padding:10px 20px;background:none;border:none;border-bottom:2px solid ${i===0?'var(--primary-color)':'transparent'};font-size:14px;font-weight:${i===0?'700':'500'};color:${i===0?'var(--primary-color)':'var(--text-muted)'};cursor:pointer;margin-bottom:-2px;">${t}</button>`).join('')}
      </div>

      <!-- Tab 0: Overview -->
      <div id="tab0">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xl);">
          <!-- Personal Info -->
          <div class="card">
            <div class="card-header"><span class="card-title">👤 Personal Information</span></div>
            <div class="card-body">
              ${[['Full Name',student.name],['Date of Birth',formatDate(student.dob)],['Gender',student.gender],['Student ID',student.id],['Admission No.',student.admissionNo],['Admission Date',formatDate(student.admissionDate)],['Status',student.status==='active'?'✅ Active':'❌ Inactive']].map(([l,v])=>`
                <div style="display:flex;padding:8px 0;border-bottom:1px solid var(--border-light);">
                  <span style="color:var(--text-muted);font-size:13px;min-width:140px;">${l}</span>
                  <strong style="font-size:13px;">${v||'—'}</strong>
                </div>`).join('')}
            </div>
          </div>
          <!-- Academic + Parent Info -->
          <div style="display:flex;flex-direction:column;gap:var(--space-lg);">
            <div class="card">
              <div class="card-header"><span class="card-title">🏫 Academic Information</span></div>
              <div class="card-body">
                ${[['Section',getSectionName(student.section)],['Class',cls?cls.name:'—'],['Arm/Stream',student.arm||'—'],['Session',PA_DATA.school.session],['Term',PA_DATA.school.term]].map(([l,v])=>`
                  <div style="display:flex;padding:7px 0;border-bottom:1px solid var(--border-light);">
                    <span style="color:var(--text-muted);font-size:13px;min-width:120px;">${l}</span>
                    <strong style="font-size:13px;">${v||'—'}</strong>
                  </div>`).join('')}
              </div>
            </div>
            <div class="card">
              <div class="card-header"><span class="card-title">👨‍👩‍👧 Parent / Guardian</span></div>
              <div class="card-body">
                ${parent?[['Name',parent.name],['Phone',parent.phone],['Email',parent.email],['Address',parent.address]].map(([l,v])=>`
                  <div style="display:flex;padding:7px 0;border-bottom:1px solid var(--border-light);">
                    <span style="color:var(--text-muted);font-size:13px;min-width:80px;">${l}</span>
                    <span style="font-size:13px;">${v||'—'}</span>
                  </div>`).join(''):
                '<p style="color:var(--text-muted);font-size:13px;">No parent record linked.</p>'}
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab 1: Academic -->
      <div id="tab1" style="display:none;">
        <div class="card">
          <div class="card-header"><span class="card-title">📚 Subjects & Performance</span></div>
          <div class="card-body">
            ${resultData?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-md);">
              ${resultData.subjects.map(s=>`<div style="padding:var(--space-md);background:var(--surface-alt);border-radius:var(--radius-md);border:1px solid var(--border-light);">
                <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${s.name}</div>
                <div style="font-size:24px;font-weight:700;color:${s.total>=75?'var(--success-color)':s.total<45?'var(--danger-color)':'var(--warning-color)'};">${s.total}</div>
                <div style="font-size:12px;color:var(--text-muted);">Grade: <strong style="color:var(--primary-color);">${s.grade}</strong> · ${s.remark}</div>
                <div style="margin-top:6px;height:4px;background:var(--border-light);border-radius:2px;"><div style="width:${s.total}%;height:100%;background:${s.total>=75?'var(--success-color)':s.total<45?'var(--danger-color)':'var(--warning-color)'};border-radius:2px;"></div></div>
              </div>`).join('')}
            </div>`:`<div class="empty-state" style="padding:40px;"><div class="empty-state-icon">📚</div><div class="empty-state-title">No Results Published</div></div>`}
          </div>
        </div>
      </div>

      <!-- Tab 2: Attendance -->
      <div id="tab2" style="display:none;">
        <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:var(--space-lg);">
          <div class="stat-card green"><div class="stat-icon green" style="width:40px;height:40px;">✅</div><div class="stat-content"><div class="stat-value">52</div><div class="stat-label">Present</div></div></div>
          <div class="stat-card red"><div class="stat-icon red" style="width:40px;height:40px;">❌</div><div class="stat-content"><div class="stat-value">3</div><div class="stat-label">Absent</div></div></div>
          <div class="stat-card orange"><div class="stat-icon orange" style="width:40px;height:40px;">⏰</div><div class="stat-content"><div class="stat-value">0</div><div class="stat-label">Late</div></div></div>
          <div class="stat-card green"><div class="stat-icon green" style="width:40px;height:40px;">📊</div><div class="stat-content"><div class="stat-value">94.5%</div><div class="stat-label">Rate</div></div></div>
        </div>
        <div class="card"><div class="card-header"><span class="card-title">📅 Attendance Calendar</span></div>
          <div class="card-body"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:3px;" id="profCal"></div></div>
        </div>
      </div>

      <!-- Tab 3: Fees -->
      <div id="tab3" style="display:none;">
        <div class="card">
          <div class="card-header"><span class="card-title">💰 Fee Status — ${PA_DATA.school.term}</span></div>
          <div class="card-body" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xl);">
            <div>
              <table style="width:100%;font-size:13px;"><tbody>
                ${Object.entries(PA_DATA.feeStructure[student.section]||{}).map(([k,v])=>k!=='total'?`<tr style="border-bottom:1px solid var(--border-light);"><td style="padding:8px 0;color:var(--text-muted);text-transform:capitalize;">${k}</td><td style="text-align:right;font-weight:600;">₦${v.toLocaleString()}</td></tr>`:``).join('')}
                <tr><td style="padding:10px 0;font-weight:700;color:var(--primary-color);">Total</td><td style="text-align:right;font-weight:700;font-size:15px;color:var(--primary-color);">₦${(PA_DATA.feeStructure[student.section]?.total||0).toLocaleString()}</td></tr>
              </tbody></table>
            </div>
            <div style="text-align:center;padding:var(--space-xl);">
              ${(()=>{const p=PA_DATA.payments.find(x=>x.studentId===student.id);return p?`<div style="font-size:48px;">${p.status==='paid'?'✅':'⏳'}</div><span class="badge badge-dot ${p.status==='paid'?'badge-success':'badge-warning'}" style="font-size:14px;padding:8px 16px;">${p.status==='paid'?'Paid':'Pending'}</span>${p.status==='paid'?`<div style="margin-top:12px;font-size:12px;color:var(--text-muted);">Paid ${formatDate(p.date)}<br>${p.method}<br>Receipt: ${p.receiptNo}</div>`:''}`:'<div style="color:var(--text-muted);">No payment record found</div>'})()}
            </div>
          </div>
        </div>
      </div>

      <!-- Tab 4: Results -->
      <div id="tab4" style="display:none;">
        ${resultData?`<div class="card">
          <div class="card-header"><span class="card-title">📊 ${resultData.term} — ${resultData.session}</span><a href="report-card.html?student=${student.id}" class="btn btn-primary btn-sm">🖨 Print Card</a></div>
          <div class="table-wrapper"><table class="table">
            <thead><tr><th>Subject</th><th style="text-align:center;">CA</th><th style="text-align:center;">Exam</th><th style="text-align:center;">Total</th><th style="text-align:center;">Grade</th><th>Remark</th></tr></thead>
            <tbody>${resultData.subjects.map(s=>`<tr><td><strong>${s.name}</strong></td><td style="text-align:center;">${s.ca}</td><td style="text-align:center;">${s.exam}</td><td style="text-align:center;font-weight:700;color:${s.total>=75?'var(--success-color)':s.total<45?'var(--danger-color)':'var(--warning-color)'};">${s.total}</td><td style="text-align:center;font-weight:700;color:var(--primary-color);">${s.grade}</td><td style="font-size:12px;">${s.remark}</td></tr>`).join('')}</tbody>
          </table></div>
          <div class="card-footer"><span>Average: <strong style="color:var(--primary-color);">${resultData.average}%</strong></span><span style="margin-left:24px;">Position: <strong style="color:var(--secondary-color);">${resultData.position} of ${resultData.totalStudents}</strong></span></div>
        </div>`:`<div class="card"><div class="empty-state" style="padding:60px;"><div class="empty-state-icon">📊</div><div class="empty-state-title">No Results Available</div></div></div>`}
      </div>
    `;

    // Calendar
    const cal=document.getElementById('profCal');
    if(cal){for(let i=1;i<=55;i++){const r=Math.random();const c=r>0.05?'var(--success-color)':'var(--danger-color)';cal.innerHTML+=`<div style="height:26px;background:${c};border-radius:3px;display:flex;align-items:center;justify-content:center;color:white;font-size:9px;font-weight:700;">${i}</div>`;}}
  }

  function switchTab(btn, tabId){
    document.querySelectorAll('.tab-trigger').forEach(b=>{
      b.style.borderBottomColor='transparent';b.style.color='var(--text-muted)';b.style.fontWeight='500';
    });
    btn.style.borderBottomColor='var(--primary-color)';btn.style.color='var(--primary-color)';btn.style.fontWeight='700';
    for(let i=0;i<5;i++){const t=document.getElementById('tab'+i);if(t)t.style.display=tabId==='tab'+i?'block':'none';}
  }

  loadProfile();
</script>
</body>
</html>
